<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - QueueLess AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-clock-history text-primary fs-3"></i>
        <span>QueueLess <span class="text-primary">AI</span></span>
      </a>
      <a href="register.html" class="btn btn-outline-primary btn-sm">Create New Account</a>
    </div>
  </nav>

  <!-- Login Container -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 p-md-5 border-0 shadow">
          <div class="text-center mb-4">
            <div class="stat-icon stat-blue mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
            <h3 class="fw-bold">Sign In to QueueLess AI</h3>
            <p class="text-muted small">Access your queues, counter desk, or organization dashboard</p>
          </div>

          <form id="login-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                <input type="password" id="login-password" class="form-control" placeholder="Enter password" required>
                <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember-me" checked>
                <label class="form-check-label small" for="remember-me">Remember me</label>
              </div>
              <a href="javascript:void(0)" onclick="alert('For demo accounts, use password: Password@123')" class="small">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-login">
              <span id="btn-text">Sign In</span>
              <span id="btn-spinner" class="spinner-border spinner-border-sm d-none"></span>
            </button>
          </form>

          <!-- Quick Fill Demo Accounts for MCA Presentation -->
          <div class="mt-4 pt-3 border-top">
            <div class="small fw-bold text-muted mb-2 text-center text-uppercase" style="font-size:0.75rem;">
              Quick Demo Accounts (1-Click Fill)
            </div>
            <div class="d-flex flex-wrap gap-1 justify-content-center">
              <button class="btn btn-sm btn-outline-dark" onclick="fillCreds('superadmin@queueless.ai', 'Password@123')">Super Admin</button>
              <button class="btn btn-sm btn-outline-primary" onclick="fillCreds('admin@citycare.org', 'Password@123')">Hospital Admin</button>
              <button class="btn btn-sm btn-outline-success" onclick="fillCreds('admin@apexbank.com', 'Password@123')">Bank Admin</button>
              <button class="btn btn-sm btn-outline-info" onclick="fillCreds('staff.drsharma@citycare.org', 'Password@123')">Staff (Dr. Sharma)</button>
              <button class="btn btn-sm btn-outline-secondary" onclick="fillCreds('customer@gmail.com', 'Password@123')">Customer (Aarav)</button>
            </div>
          </div>

          <div class="text-center mt-4">
            <span class="text-muted small">New to QueueLess AI? </span>
            <a href="register.html" class="small fw-semibold">Register here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-3 bg-white border-top text-center text-muted small">
    © 2026 QueueLess AI. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillCreds(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      window.API.showToast(`Selected demo credentials for: ${email}`, 'info', 2000);
    }

    document.getElementById('toggle-password').addEventListener('click', function() {
      const pwd = document.getElementById('login-password');
      const icon = this.querySelector('i');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const submitBtn = document.getElementById('btn-login');

      try {
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');
        submitBtn.disabled = true;

        const res = await window.API.post('/auth/login', { email, password });

        if (res.success && res.data) {
          window.AUTH.setUser(res.data.token, res.data.user);
          window.API.showToast(`Welcome back, ${res.data.user.full_name}!`, 'success', 2000);
          setTimeout(() => {
            window.AUTH.redirectByRole(res.data.user.role);
          }, 600);
        }
      } catch (err) {
        window.API.showToast(err.message || 'Login failed. Please verify credentials.', 'error');
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
