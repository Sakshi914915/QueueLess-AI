<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Live Queue Display - QueueLess AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: #0b1120;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .tv-header {
      background: #0f172a;
      border-bottom: 2px solid #1e293b;
      padding: 16px 32px;
    }
    .serving-screen-card {
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.2);
    }
    .tv-token-big {
      font-size: 4rem;
      font-weight: 900;
      color: #60a5fa;
      letter-spacing: -1px;
      line-height: 1.1;
    }
    .counter-tag {
      font-size: 1.4rem;
      font-weight: 700;
      background: #2563eb;
      color: #fff;
      padding: 6px 20px;
      border-radius: 30px;
      display: inline-block;
    }
    .next-list-card {
      background: #131d31;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      height: 100%;
    }
    .next-item {
      padding: 14px 18px;
      background: #1e293b;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-left: 4px solid #3b82f6;
    }
  </style>
</head>
<body>

  <!-- TV Topbar -->
  <header class="tv-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-broadcast text-danger fs-2 animate-pulse"></i>
      <div>
        <h3 class="fw-black mb-0 text-white" id="tv-org-name">QueueLess AI Display</h3>
        <div class="text-secondary small" id="tv-branch-name">Live Reception Display Screen</div>
      </div>
    </div>
    <div class="d-flex align-items-center gap-4">
      <div class="text-end">
        <div class="fs-4 fw-bold text-white font-monospace" id="live-clock">00:00:00</div>
        <div class="text-secondary small" id="live-date">--</div>
      </div>
      <button class="btn btn-outline-light btn-sm" onclick="toggleFullScreen()"><i class="bi bi-arrows-fullscreen"></i></button>
    </div>
  </header>

  <div class="container-fluid px-4 py-4">
    <!-- Branch Selector Bar for kiosk setup -->
    <div class="d-flex align-items-center gap-2 mb-4 p-2 bg-dark rounded border border-secondary" id="kiosk-config-bar">
      <span class="small text-muted me-2"><i class="bi bi-gear me-1"></i>TV Kiosk Setup:</span>
      <select id="kiosk-branch-select" class="form-select form-select-sm w-auto bg-dark text-white border-secondary" onchange="onKioskBranchChange()">
        <option value="1">CityCare Hospital - Downtown Campus</option>
        <option value="2">CityCare Hospital - Andheri North Clinic</option>
        <option value="3">Apex Union Bank - Fort Financial Branch</option>
      </select>
      <span class="badge bg-success ms-auto"><i class="bi bi-wifi me-1"></i>Socket.IO Live Synced</span>
    </div>

    <div class="row g-4">
      <!-- Left Column: NOW SERVING COUNTERS -->
      <div class="col-lg-8">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h4 class="fw-bold mb-0 text-uppercase tracking-wider text-primary"><i class="bi bi-megaphone-fill me-2"></i>Now Serving</h4>
          <span class="badge bg-primary px-3 py-1">Active Counters</span>
        </div>

        <div class="row g-3" id="now-serving-grid">
          <div class="col-12 text-center py-5 text-secondary">
            <span class="spinner-border text-primary"></span>
            <div class="mt-2">Connecting to live branch queue stream...</div>
          </div>
        </div>
      </div>

      <!-- Right Column: NEXT IN LINE -->
      <div class="col-lg-4">
        <div class="next-list-card">
          <div class="d-flex align-items-center justify-content-between mb-3 border-bottom border-secondary pb-2">
            <h5 class="fw-bold mb-0 text-uppercase text-light"><i class="bi bi-arrow-right-circle-fill me-2 text-info"></i>Next In Line</h5>
            <span class="badge bg-secondary">Waiting</span>
          </div>

          <div id="next-waiting-list">
            <div class="text-center py-5 text-secondary small">Waiting for queue updates...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/socket.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let branchId = parseInt(urlParams.get('branchId') || '1', 10);

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString();
      document.getElementById('live-date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    async function loadTVDisplay() {
      try {
        const branchSelect = document.getElementById('kiosk-branch-select');
        if (branchSelect) branchSelect.value = branchId;

        // Fetch branch info
        const bRes = await window.API.get(`/branches/${branchId}`);
        const branch = bRes.data;
        document.getElementById('tv-org-name').textContent = branch.organization_name;
        document.getElementById('tv-branch-name').textContent = `${branch.name} — TV Hall Display`;

        // Fetch live queue
        const qRes = await window.API.get(`/queue/${branchId}/all`);
        const { servingTokens, waitingQueue } = qRes.data;

        // Render Now Serving Grid
        const servingGrid = document.getElementById('now-serving-grid');
        if (servingTokens.length === 0) {
          servingGrid.innerHTML = `
            <div class="col-12 text-center py-5">
              <div class="display-1 text-secondary opacity-25"><i class="bi bi-clock"></i></div>
              <h3 class="fw-bold text-light mt-3">All Counters Ready</h3>
              <p class="text-secondary">Please take a digital token to be called.</p>
            </div>
          `;
        } else {
          servingGrid.innerHTML = servingTokens.map(t => `
            <div class="col-md-6">
              <div class="serving-screen-card">
                <div class="counter-tag mb-3">${t.counter_name}</div>
                <div class="tv-token-big my-2">${t.token_number}</div>
                <h5 class="fw-bold text-light mb-1">${t.service_name}</h5>
                <span class="badge ${t.status === 'called' ? 'bg-warning text-dark' : 'bg-success'} text-uppercase px-3 py-1">
                  ${t.status === 'called' ? 'PROCEED TO COUNTER' : 'NOW SERVING'}
                </span>
              </div>
            </div>
          `).join('');
        }

        // Render Next Waiting List
        const nextList = document.getElementById('next-waiting-list');
        if (waitingQueue.length === 0) {
          nextList.innerHTML = '<div class="text-center py-4 text-secondary small">No waiting customers in line.</div>';
        } else {
          nextList.innerHTML = waitingQueue.slice(0, 8).map(w => `
            <div class="next-item">
              <div>
                <span class="fw-bold fs-5 text-light">${w.token_number}</span>
                <div class="text-secondary small">${w.service_name}</div>
              </div>
              <div class="text-end">
                <span class="badge bg-primary">#${w.queue_position}</span>
                <div class="text-secondary small mt-1">~${w.estimated_wait_minutes} min</div>
              </div>
            </div>
          `).join('');
        }

      } catch (err) {
        console.error('TV display error:', err);
      }
    }

    function onKioskBranchChange() {
      branchId = parseInt(document.getElementById('kiosk-branch-select').value, 10);
      if (window.SOCKET) {
        window.SOCKET.joinBranch(branchId);
      }
      loadTVDisplay();
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadTVDisplay();
      if (window.SOCKET) {
        window.SOCKET.joinBranch(branchId);
        const s = window.SOCKET.get();
        if (s) {
          s.on('public_display_updated', () => loadTVDisplay());
          s.on('queue_updated', () => loadTVDisplay());
          s.on('token_status_changed', () => loadTVDisplay());
        }
      }
    });
  </script>
</body>
</html>
